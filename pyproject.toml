[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "alphaforge-portfolio-engine"
version = "0.1.0"
description = "Comparaison historique reproductible de portefeuilles fictifs"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35.0,<2.0.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.9,<3.0",
  "streamlit>=1.50,<2.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[tool.setuptools]
packages = ["alphaforge", "agent", "api"]
